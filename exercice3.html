<!DOCTYPE html>
<html>
<body>

<h1>Exercice 3</h1>

<p id="result"></p>

<script>
function verifierLuhn(numeroCarte){
  let chiffres = numeroCarte.toString().split('').reverse();
  let somme = 0;

  chiffres.forEach(function(item, index){
    let chiffre = parseInt(item, 10);

    if(index % 2 === 1){
      chiffre = chiffre * 2;
      if(chiffre > 9){
        chiffre = chiffre - 9;
      }
    }

    somme = somme + chiffre;
  });

  return somme % 10 === 0;
}

let numero = "4556483529563734";
let output = "";

if(verifierLuhn(numero)){
  output = numero + " : Validé";
}else{
  output = numero + " : Non Validé";
}

document.getElementById("result").innerHTML = output;
</script>

</body>
</html>

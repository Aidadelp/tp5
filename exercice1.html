<!DOCTYPE html>
<html>
<body>

<h1>Exercice 1</h1>

<p id="result"></p>

<script>
let output = "";

for (let A = 1; A <= 9; A++) {
  for (let B = 1; B <= 9; B++) {
    for (let C = 1; C <= 9; C++) {
      let ABC = A * 100 + B * 10 + C;
      let sum = A * A * A + B * B * B + C * C * C;

      if (ABC === sum) {
        output += ABC + "<br>";
      }
    }
  }
}

document.getElementById("result").innerHTML = output;
</script>

</body>
</html>
